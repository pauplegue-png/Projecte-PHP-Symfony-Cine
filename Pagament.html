<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Datos de pago</title>
    <link rel="stylesheet" href="css/colors.css" />
    <link rel="stylesheet" href="fonts/typography.css" />
    <link rel="stylesheet" href="fonts/sizes.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/headers.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
  </head>
  <body class="bg-blancoroto font-body text-grisoscuro min-h-screen flex flex-col">
    <header class="header-pelicula relative overflow-hidden text-blanco" aria-label="Información de la película">
        <img src="img/cabecera-pelicula.png" alt="" class="header-img absolute inset-0 w-full h-full object-cover" />
        <div class="relative z-10">
        <div class="flex items-center justify-between gap-4 px-4 sm:px-8 pt-4">
          <nav aria-label="Navegación principal" class="flex items-center gap-3">
            <a href="index.html" aria-label="Ir al inicio" class="inline-flex text-blanco hover:opacity-80 transition"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
            <a href="resumenCompra.html" aria-label="Volver" class="inline-flex text-blanco hover:opacity-80 transition"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
          </nav>
          <nav aria-label="Cuenta de usuario" class="flex items-center gap-3">
            <a href="perfilUsuari.html" aria-label="Perfil de usuario" class="inline-flex"><span class="grid place-items-center w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-rojooscuro text-blanco border border-grisclaro">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </span></a>
            <a href="Login.html" aria-label="Cerrar sesión" class="inline-flex text-blanco hover:opacity-80 transition"><svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></a>
          </nav>
        </div>
        <div class="px-4 pt-6 pb-8 sm:pb-10 text-center">
          <h1 class="font-ui text-subheading font-medium">Hasta el horizonte</h1>
          <p class="mt-1 flex flex-wrap justify-center items-center gap-2 text-small">
            <span class="text-amarillo font-semibold">M-12</span><span>159 min</span><span aria-hidden="true">|</span><span>Acción, Drama</span>
          </p>
        </div>
        </div>
      </header>
    <main class="flex-1 mx-auto w-full max-w-[760px] px-4 sm:px-8 py-8">
      <h2 class="font-heading font-semibold text-title text-center">Datos de pago</h2>
      <form action="trans_ok.html" class="mt-8 grid gap-5 rounded-2xl border border-grisoscuro/70 bg-blanco p-5 sm:p-8">
        <div>
          <label for="nombre" class="block text-small font-semibold mb-1">Nombre i Apellidos</label>
          <input id="nombre" name="nombre" type="text" placeholder="Juan Garcia Fernandez" autocomplete="cc-name" class="w-full h-12 px-4 rounded-xl border border-grisclaro bg-blanco text-body focus:outline-none focus:border-rojosuave" />
        </div>
        <div>
          <label for="tarjeta" class="block text-small font-semibold mb-1">Numero de la Targeta</label>
          <input id="tarjeta" name="tarjeta" type="text" inputmode="numeric" placeholder="0000-0000-0000-0000" autocomplete="cc-number" class="w-full h-12 px-4 rounded-xl border border-grisclaro bg-blanco text-body focus:outline-none focus:border-rojosuave" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="caducidad" class="block text-small font-semibold mb-1">MM/YY</label>
            <input id="caducidad" name="caducidad" type="text" placeholder="MM/YY" autocomplete="cc-exp" class="w-full h-12 px-4 rounded-xl border border-grisclaro bg-blanco text-body focus:outline-none focus:border-rojosuave" />
          </div>
          <div>
            <label for="cvv" class="block text-small font-semibold mb-1">Codigo Targeta</label>
            <input id="cvv" name="cvv" type="text" inputmode="numeric" placeholder="000" autocomplete="cc-csc" class="w-full h-12 px-4 rounded-xl border border-grisclaro bg-blanco text-body focus:outline-none focus:border-rojosuave" />
          </div>
        </div>
        <div class="flex flex-wrap justify-center gap-4 pt-2">
          <a href="trans_error.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-lg border border-grisclaro bg-blanco text-grisoscuro text-small font-medium hover:bg-grismuyclaro transition">Simular error</a>
          <button type="submit" class="inline-flex items-center gap-2 px-8 py-3 rounded-lg bg-rojooscuro hover:bg-rojohover text-blanco text-small font-medium transition"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7l1.5 3 3.3.5-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.4-2.3 3.3-.5z"/></svg>Realizar la compra</button>
        </div>
      </form>
    </main>
    <footer class="bg-rojosuave text-blanco font-subheading text-small sm:text-subheading px-6 sm:px-[72px] py-4 mt-auto">
      Todos los derechos reservados
    </footer>
  </body>
</html>
