<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta charset="utf-8" />
<title>Error de pago</title>
<link rel="stylesheet" href="css/colors.css" />
    <link rel="stylesheet" href="fonts/typography.css" />
    <link rel="stylesheet" href="fonts/sizes.css" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
</head>
<body>
<main
    class="flex flex-col h-[1024px] items-center justify-center relative bg-gray-50"
    aria-labelledby="payment-error-title"
  >
<section
      class="flex flex-col w-[560px] h-[361px] items-start gap-[38px] p-12 relative bg-white rounded-2xl border border-solid border shadow-[0px_4px_24px_#0000000d]"
      aria-describedby="payment-error-description"
    >
<header
        class="flex flex-col items-center gap-6 relative self-stretch w-full flex-[0_0_auto] bg-transparent"
      >
<div
          class="flex flex-col w-20 h-20 items-center justify-center relative bg-red-100 rounded-[40px]"
          aria-hidden="true"
        >
<div class="relative w-10 h-10">
<img
              class="absolute w-[84.75%] h-[77.06%] top-[22.94%] left-[15.25%]"
              src="img/error-cross.svg"
              alt=""
            />
</div>
</div>
<div
          class="flex flex-col items-center gap-2 relative self-stretch w-full flex-[0_0_auto]"
        >
<h1
            id="payment-error-title"
            class="relative self-stretch mt-[-1.00px] [font-family:'Nunito-Bold',Helvetica] font-bold text-gray-900 text-[28px] text-center tracking-[0] leading-[normal]"
          >
No se ha podido completar el pago
          </h1>
<p
            id="payment-error-description"
            class="relative self-stretch [font-family:'Lato-Regular',Helvetica] font-normal text-gray-500 text-base text-center tracking-[0] leading-6"
          >
Revisa tus datos de pago y vuelve a intentarlo.
          </p>
</div>
</header>
<div
        class="flex flex-col items-start gap-3 relative self-stretch w-full flex-[0_0_auto]"
      >
<button
          type="button"
          class="flex items-center justify-center p-4 relative self-stretch w-full flex-[0_0_auto] bg-gray-900 rounded-lg border border-solid"
        >
<span
            class="relative w-fit mt-[-1.00px] [font-family:'Lato-SemiBold',Helvetica] font-semibold text-white text-base tracking-[0] leading-[normal] whitespace-nowrap"
          >
Volver a introducir los datos de pago
          </span>
</button>
</div>
</section>
</main>
</body>
</html>
